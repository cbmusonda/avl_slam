# ============================================================
#  ZED X — Back Camera Config
#  Mounted: Rear center of vehicle
#  Namespace: /zed_back
#  Serial: 49910017
#  Status: auxiliary camera — publishes but not primary RTAB-Map input
# ============================================================

zed_node:
  ros__parameters:

    # ── Camera Identity ───────────────────────────────────────
    camera_model: 'zedx'
    camera_name: 'zed_back'
    serial_number: 49910017

    # ── Frames ───────────────────────────────────────────────
    base_frame: 'base_link'
    camera_frame: 'zed_back_camera_center'
    publish_tf: false          # RTAB-Map handles TF
    publish_map_tf: false

    # ── Resolution & Frame Rate ───────────────────────────────
    general.grab_resolution: 'HD720'     # 1280x720
    general.grab_frame_rate: 15          # 15 Hz — auxiliary camera
    general.self_calib: true

    # ── Depth ─────────────────────────────────────────────────
    depth.depth_mode: 'PERFORMANCE'
    depth.min_depth: 0.3
    depth.max_depth: 20.0
    depth.depth_stabilization: 30

    # ── Image output ──────────────────────────────────────────
    video.img_downsample_factor: 1.0
    video.brightness: 4
    video.contrast: 4
    video.hue: 0
    video.saturation: 4
    video.sharpness: 4
    video.gamma: 8
    video.auto_exposure_gain: true
    video.auto_whitebalance: true

    # ── Point Cloud ───────────────────────────────────────────
    point_cloud_freq: 5.0
    mapping.mapping_enabled: false

    # ── IMU ───────────────────────────────────────────────────
    sensors.publish_imu_tf: false
    # FIX #7: sensors_image_sync must be true so depth and RGB share timestamps.
    sensors.sensors_image_sync: true

    # FIX #8: use_sim_time was missing from zed_back.yaml (present in left/right)
    # ── QoS ───────────────────────────────────────────────────
    use_sim_time: false