# ============================================================
#  ZED X — Right Camera Config
#  Mounted: Right side of vehicle
#  Namespace: /zed_right
#  Serial: 47753729
#  Status: PRIMARY RGB-D input to RTAB-Map (default use_realsense:=false path)
# ============================================================

zed_node:
  ros__parameters:

    # ── Camera Identity ───────────────────────────────────────
    camera_model: 'zedx'
    camera_name: 'zed_right'
    serial_number: 47753729

    # ── Frames ───────────────────────────────────────────────
    base_frame: 'base_link'
    camera_frame: 'zed_right_camera_center'
    publish_tf: false          # RTAB-Map handles TF
    publish_map_tf: false

    # ── Resolution & Frame Rate ───────────────────────────────
    general.grab_resolution: 'HD720'     # 1280x720
    general.grab_frame_rate: 15          # 15 Hz
    general.self_calib: true

    # ── Depth ─────────────────────────────────────────────────
    depth.depth_mode: 'PERFORMANCE'
    depth.min_depth: 0.3
    depth.max_depth: 20.0
    depth.depth_stabilization: 30

    # ── Image output ──────────────────────────────────────────
    video.img_downsample_factor: 1.0
    video.brightness: 4
    video.contrast: 4
    video.hue: 0
    video.saturation: 4
    video.sharpness: 4
    video.gamma: 8
    video.auto_exposure_gain: true
    video.auto_whitebalance: true

    # ── Point Cloud ───────────────────────────────────────────
    point_cloud_freq: 5.0
    mapping.mapping_enabled: false

    # ── IMU ───────────────────────────────────────────────────
    sensors.publish_imu_tf: false
    # FIX #7: sensors_image_sync must be true so depth and RGB share timestamps.
    sensors.sensors_image_sync: true

    # ── QoS ───────────────────────────────────────────────────
    use_sim_time: false