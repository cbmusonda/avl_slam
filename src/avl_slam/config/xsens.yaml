# Xsens MTi Driver Configuration
# Package: ros2_xsens_mti_driver (DEMCON fork)
# Repo: https://github.com/DEMCON/ros2_xsens_mti_driver
#
# TOPIC MAP — MTi-680G with VRU/AHRS/INS filter mode enabled:
#
#   /imu/data                  — sensor_msgs/Imu
#                                  FUSED: orientation (quaternion) + angular velocity + linear accel
#                                  ← THIS is what RTAB-Map subscribes to
#                                  Published by ImuPublisher in the driver source.
#
#   /imu/mag                   — sensor_msgs/MagneticField
#   /filter/quaternion         — geometry_msgs/QuaternionStamped  (orientation only)
#   /filter/free_acceleration  — geometry_msgs/Vector3Stamped
#   /imu/time_ref              — sensor_msgs/TimeReference (most accurate timestamps)
#
# NOTE: /filter/imu/data is NOT published by this driver. The combined fused
#       sensor_msgs/Imu message is always published to /imu/data.

xsens_mti_node:
  ros__parameters:

    # ── Connection ───────────────────────────────────────────────────
    # Fixed port for repeatable startup. Update if the port changes.
    # Check current port: ls /dev/ttyUSB*
    scan_for_devices: false
    port: "/dev/ttyUSB0"
    baudrate: 115200
    # NOTE: Increase baudrate to 921600 in MT Manager if you need >100 Hz output.
    # At 115200 the max reliable output rate is ~100 Hz. The Madgwick filter
    # config (imu_filter.yaml) is set to 100 Hz to match.
    # Steps to change: MT Manager → Device Settings → Output Configuration →
    # set baudrate, save to device, then update this field.

    # ── Frame ────────────────────────────────────────────────────────
    frame_id: "imu_link"     # must match static TF parent in slam.launch.py

    # ── Logging ──────────────────────────────────────────────────────
    enable_logging: false
    log_file: "xsens_log"

    publisher_queue_size: 5